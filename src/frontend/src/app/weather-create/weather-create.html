<div>
    <div class="container mt-5">
        <div class="card">
            <div class="card-hearder">
                <h4>Create Weatherforecast</h4>
            </div>
            <div class="card-body">
                <form (ngSubmit)="saveWeatherForecast()">
                    <div class="mb-3">
                        <label>Datum</label>
                        <input type="date" [(ngModel)]="date" name="name" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label>Temperatur °C</label>
                        <input type="number" [(ngModel)]="temperatureC" name="name" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label>Temperatur °F</label>
                        <input type="number" [(ngModel)]="temperatureF" name="name" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label>Zusammenfassung</label>
                        <input type="text" [(ngModel)]="summary" name="name" class="form-control" />
                    </div>

                    <div class="d-flex gap-2 mb-3">
                        <button type="submit" class="btn btn-primary">Speichern</button>
                        <button routerLink="/weather" type="button" class="btn btn-secondary">Abbrechen</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
