<div class="container">
  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>
  <div *ngIf="!error && users.length">
    <h2>Benutzer</h2>
    <div class="row">
      <div class="col d-flex gap-1 mb-2">
        <button class="btn btn-primary" type="button" routerLink="/weather/create">
          <i class="bi bi-plus"></i>
        </button>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th>Benutzername</th>
              <th>Mail-Adresse</th>
              <th>Rolle</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td>0</td>
              <td>{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.roles }}</td>
              <td>
                <div class="d-flex gap-2 mb3">
                  <button class="btn btn-primary btn-custom" routerLink="/admin/user/edit/{{ user.email }}">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-primary" (click)="deleteUserByMail(user.email!)">
                    <i class="bi bi-x-square"></i>
                  </button>
                  <button class="btn btn-primary">
                    <i class="bi bi-x-key"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div *ngIf="!error && !users.length">
    <p>No user data availabe at the moment.</p>
  </div>
</div>
